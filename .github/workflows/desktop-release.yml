name: Vibra Music Windows Desktop CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Release (.msi & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Windows Distributable & MSI Package
        run: |
          ./gradlew :desktop:packageMsi :desktop:createDistributable --no-daemon

      - name: Prepare Windows Distribution Archives
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/", "" } else { "v1.8.20" }
          New-Item -ItemType Directory -Force -Path "desktop/dist" | Out-Null
          
          # Copy and rename MSI
          $msi = Get-ChildItem -Path "desktop/build/compose/binaries/main/msi" -Filter "*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item -Path $msi.FullName -Destination "desktop/dist/VibraMusic-$tag-Windows-Installer.msi"
          }
          
          # Compress portable distribution folder
          $appDir = "desktop/build/compose/binaries/main/app/VibraMusic"
          if (Test-Path $appDir) {
            Compress-Archive -Path "$appDir\*" -DestinationPath "desktop/dist/VibraMusic-$tag-Windows-Portable.zip" -Force
          }
          
          Get-ChildItem -Path "desktop/dist"

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VibraMusic-Windows-Release
          retention-days: 7
          path: desktop/dist/*

      - name: Publish Windows Release to Source Repo
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/VibraMusic-*-Windows-Installer.msi
            desktop/dist/VibraMusic-*-Windows-Portable.zip
          draft: false
          prerelease: false

      - name: Publish Windows Release to Public Releases Repo
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASES_TOKEN == 'true'
        env:
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: Fortunehack45/Vibra_Music_Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/dist/VibraMusic-*-Windows-Installer.msi
            desktop/dist/VibraMusic-*-Windows-Portable.zip
          draft: false
          prerelease: false
