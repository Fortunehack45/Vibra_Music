name: Vibra Music iOS CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Release (.ipa)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Auto Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER_NAME="${TAG#v}"
          else
            VER_NAME="1.0.0"
            TAG="v1.0.0"
          fi
          VER_CODE=1
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "VIBRA_VERSION_NAME=${VER_NAME}" >> $GITHUB_ENV
          echo "VIBRA_VERSION_CODE=${VER_CODE}" >> $GITHUB_ENV
          echo "Resolved iOS auto version: ${TAG} (build=${VER_CODE})"

      - name: Build Unsigned iOS App
        working-directory: iosApp
        run: |
          set -o pipefail
          TAG="${RELEASE_TAG}"
          xcodebuild \
            -workspace VibraMusic.xcworkspace \
            -scheme VibraMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/VibraMusic.app Payload/
          zip -r "VibraMusic-${TAG}-iOS-unsigned.ipa" Payload

      - name: Upload Unsigned iOS IPA
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VibraMusic-iOS-Release
          path: iosApp/VibraMusic-*-iOS-unsigned.ipa

      - name: Publish iOS Release to Source Repo
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vibra Music ${{ env.RELEASE_TAG }}
          files: iosApp/VibraMusic-*-iOS-unsigned.ipa
          draft: false
          prerelease: false

      - name: Publish iOS Release to Public Releases Repo
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_RELEASES_TOKEN == 'true'
        env:
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: Fortunehack45/Vibra_Music_Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vibra Music ${{ env.RELEASE_TAG }}
          files: iosApp/VibraMusic-*-iOS-unsigned.ipa
          draft: false
          prerelease: false
