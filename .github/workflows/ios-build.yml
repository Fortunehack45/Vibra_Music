name: Vibra Music iOS CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Release (.ipa)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Auto Version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          PATCH=$((COMMIT_COUNT - 571))
          if [ "$PATCH" -lt 37 ]; then PATCH=37; fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER_NAME="${TAG#v}"
          else
            VER_NAME="1.8.${PATCH}"
            TAG="v${VER_NAME}"
          fi
          VER_CODE=$((30 + PATCH))
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "VIBRA_VERSION_NAME=${VER_NAME}" >> $GITHUB_ENV
          echo "VIBRA_VERSION_CODE=${VER_CODE}" >> $GITHUB_ENV
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VER_NAME}" iosApp/iosApp/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VER_CODE}" iosApp/iosApp/Info.plist || true
          echo "Resolved iOS auto version: ${TAG} (build=${VER_CODE})"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK & local.properties
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/platforms"
          HIGHEST_PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* 2>/dev/null | sort -V | tail -n 1 || true)
          for VER in 36 37; do
            if [ ! -d "$ANDROID_HOME/platforms/android-$VER" ] && [ -n "$HIGHEST_PLATFORM" ]; then
              ln -s "$HIGHEST_PLATFORM" "$ANDROID_HOME/platforms/android-$VER"
            fi
          done
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY || '4ea1e882eb80524d4ed3a250f47cefe5' }}" >> local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET || '00f3857fc1d79480e51242b3720a140a' }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=https://party.vibramusic.store" >> local.properties

      - name: Build SharedUi iOS Framework (Arm64)
        run: |
          chmod +x gradlew
          ./gradlew :sharedUi:linkReleaseFrameworkIosArm64 -PiosOnly=true --no-daemon

      - name: Generate Xcode Project & Build Unsigned iOS App
        working-directory: iosApp
        run: |
          TAG="${RELEASE_TAG}"
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project VibraMusic.xcodeproj \
            -scheme VibraMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/VibraMusic.app Payload/
          zip -r "VibraMusic-${TAG}-iOS-unsigned.ipa" Payload

      - name: Upload Unsigned iOS IPA
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VibraMusic-iOS-Release
          path: iosApp/VibraMusic-*-iOS-unsigned.ipa

      - name: Publish iOS Release to Source Repo
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vibra Music ${{ env.RELEASE_TAG }}
          files: iosApp/VibraMusic-*-iOS-unsigned.ipa
          draft: false
          prerelease: false

      - name: Publish iOS Release to Public Releases Repo
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.HAS_RELEASES_TOKEN == 'true'
        env:
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: Fortunehack45/Vibra_Music_Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vibra Music ${{ env.RELEASE_TAG }}
          files: iosApp/VibraMusic-*-iOS-unsigned.ipa
          draft: false
          prerelease: false
