name: Vibra Music CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android Licenses & Ensure SDK Components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
              ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            else
              sdkmanager "platforms;android-37" || true
              if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
                HIGHEST_PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* 2>/dev/null | sort -V | tail -n 1)
                if [ -n "$HIGHEST_PLATFORM" ]; then
                  ln -s "$HIGHEST_PLATFORM" "$ANDROID_HOME/platforms/android-37"
                fi
              fi
            fi
          fi
          # Detect pre-installed NDK so AGP uses it directly without downloading
          NDK_SRC=""
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_SRC="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_NDK" ] && [ -d "$ANDROID_NDK" ]; then
            NDK_SRC="$ANDROID_NDK"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_SRC=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -n "$NDK_SRC" ] && [ -d "$NDK_SRC" ]; then
            NDK_VER=$(basename "$NDK_SRC")
            echo "Detected NDK version: $NDK_VER at $NDK_SRC"
            echo "ANDROID_NDK_VERSION=$NDK_VER" >> $GITHUB_ENV
            mkdir -p "$ANDROID_HOME/ndk"
            if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
              ln -s "$NDK_SRC" "$ANDROID_HOME/ndk/$NDK_VER"
            fi
          fi

      - name: Setup local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY || '4ea1e882eb80524d4ed3a250f47cefe5' }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET || '00f3857fc1d79480e51242b3720a140a' }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=https://party.vibramusic.store" >> local.properties

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDevDebugUnitTest --stacktrace

  build-and-release:
    name: Build Signed Release & Publish
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android Licenses & Ensure SDK Components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
              ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            else
              sdkmanager "platforms;android-37" || true
              if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
                HIGHEST_PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* 2>/dev/null | sort -V | tail -n 1)
                if [ -n "$HIGHEST_PLATFORM" ]; then
                  ln -s "$HIGHEST_PLATFORM" "$ANDROID_HOME/platforms/android-37"
                fi
              fi
            fi
          fi
          # Detect pre-installed NDK so AGP uses it directly without downloading
          NDK_SRC=""
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_SRC="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_NDK" ] && [ -d "$ANDROID_NDK" ]; then
            NDK_SRC="$ANDROID_NDK"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_SRC=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -n "$NDK_SRC" ] && [ -d "$NDK_SRC" ]; then
            NDK_VER=$(basename "$NDK_SRC")
            echo "Detected NDK version: $NDK_VER at $NDK_SRC"
            echo "ANDROID_NDK_VERSION=$NDK_VER" >> $GITHUB_ENV
            mkdir -p "$ANDROID_HOME/ndk"
            if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
              ln -s "$NDK_SRC" "$ANDROID_HOME/ndk/$NDK_VER"
            fi
          fi

      - name: Setup Secrets (Keystore & local.properties)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${LASTFM_API_KEY:-4ea1e882eb80524d4ed3a250f47cefe5}" > local.properties
          echo "LASTFM_SECRET=${LASTFM_SECRET:-00f3857fc1d79480e51242b3720a140a}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=https://party.vibramusic.store" >> local.properties

          KS_B64="${KEYSTORE_BASE64:-}"
          echo "$KS_B64" | base64 -d > siren-music-release.jks
          echo "storeFile=siren-music-release.jks" > keystore.properties
          echo "storePassword=${KEYSTORE_PASSWORD:-SirenMusicRelease2026!}" >> keystore.properties
          echo "keyAlias=${KEY_ALIAS:-sirenmusic}" >> keystore.properties
          echo "keyPassword=${KEY_PASSWORD:-SirenMusicRelease2026!}" >> keystore.properties

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Build Signed Release APKs & Bundle
        run: ./gradlew assembleProdRelease bundleProdRelease --stacktrace

      - name: Prepare and Rename Release Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.8.17"
          fi
          cd app/build/outputs/apk/prod/release
          
          # Copy to prominent, descriptive filenames
          cp app-prod-universal-release.apk "VibraMusic-${TAG}-Universal-AllDevices.apk"
          cp app-prod-arm64-v8a-release.apk "VibraMusic-${TAG}-arm64-v8a.apk"
          cp app-prod-armeabi-v7a-release.apk "VibraMusic-${TAG}-armeabi-v7a.apk"
          cp app-prod-x86_64-release.apk "VibraMusic-${TAG}-x86_64.apk"
          
          # Remove raw Gradle output names so releases display only clean, well-named files
          rm -f app-prod-*.apk
          
          # Generate checksums for the renamed artifacts
          sha256sum VibraMusic-${TAG}-*.apk > checksums.txt
          
          # Rename AAB as well
          cd "$GITHUB_WORKSPACE/app/build/outputs/bundle/prodRelease"
          cp app-prod-release.aab "VibraMusic-${TAG}.aab"
          rm -f app-prod-release.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vibra-music-release-artifacts
          retention-days: 3
          path: |
            app/build/outputs/apk/prod/release/VibraMusic-*.apk
            app/build/outputs/apk/prod/release/checksums.txt
            app/build/outputs/bundle/prodRelease/*.aab

      - name: Create GitHub Release (Source Repo)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/prod/release/VibraMusic-*.apk
            app/build/outputs/apk/prod/release/checksums.txt
            app/build/outputs/bundle/prodRelease/*.aab
          body: |
            ### 📱 Which APK should I download?
            - **Universal (Recommended)**: [`VibraMusic-${{ github.ref_name }}-Universal-AllDevices.apk`](https://github.com/Fortunehack45/Vibra_Music_Releases/releases/download/${{ github.ref_name }}/VibraMusic-${{ github.ref_name }}-Universal-AllDevices.apk) — **Works on ALL Android phones** (Android 6.0+, 32-bit & 64-bit).
            - **64-bit ARM Phones**: [`VibraMusic-${{ github.ref_name }}-arm64-v8a.apk`](https://github.com/Fortunehack45/Vibra_Music_Releases/releases/download/${{ github.ref_name }}/VibraMusic-${{ github.ref_name }}-arm64-v8a.apk) — Optimized for modern 64-bit devices.
            - **32-bit / Older / Budget Phones**: [`VibraMusic-${{ github.ref_name }}-armeabi-v7a.apk`](https://github.com/Fortunehack45/Vibra_Music_Releases/releases/download/${{ github.ref_name }}/VibraMusic-${{ github.ref_name }}-armeabi-v7a.apk) — For budget / older phones (Samsung Galaxy A01-A12, Redmi 9A/9C, Tecno, Infinix, etc.).
            - **PC Emulators / Chromebooks**: [`VibraMusic-${{ github.ref_name }}-x86_64.apk`](https://github.com/Fortunehack45/Vibra_Music_Releases/releases/download/${{ github.ref_name }}/VibraMusic-${{ github.ref_name }}-x86_64.apk) — For x86_64 emulators and Chromebooks.
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish Release to Public Releases Repo
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Fortunehack45/Vibra_Music_Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Vibra Music ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/prod/release/VibraMusic-*.apk
            app/build/outputs/apk/prod/release/checksums.txt
            app/build/outputs/bundle/prodRelease/*.aab
          body: |
            ### 📱 Which APK should I download?
            - **Universal (Recommended)**: [`VibraMusic-${{ github.ref_name }}-Universal-AllDevices.apk`](https://github.com/Fortunehack45/Vibra_Music_Releases/releases/download/${{ github.ref_name }}/VibraMusic-${{ github.ref_name }}-Universal-AllDevices.apk) — **Works on ALL Android phones** (Android 6.0+, 32-bit & 64-bit).
            - **64-bit ARM Phones**: [`VibraMusic-${{ github.ref_name }}-arm64-v8a.apk`](https://github.com/Fortunehack45/Vibra_Music_Releases/releases/download/${{ github.ref_name }}/VibraMusic-${{ github.ref_name }}-arm64-v8a.apk) — Optimized for modern 64-bit devices.
            - **32-bit / Older / Budget Phones**: [`VibraMusic-${{ github.ref_name }}-armeabi-v7a.apk`](https://github.com/Fortunehack45/Vibra_Music_Releases/releases/download/${{ github.ref_name }}/VibraMusic-${{ github.ref_name }}-armeabi-v7a.apk) — For budget / older phones (Samsung Galaxy A01-A12, Redmi 9A/9C, Tecno, Infinix, etc.).
            - **PC Emulators / Chromebooks**: [`VibraMusic-${{ github.ref_name }}-x86_64.apk`](https://github.com/Fortunehack45/Vibra_Music_Releases/releases/download/${{ github.ref_name }}/VibraMusic-${{ github.ref_name }}-x86_64.apk) — For x86_64 emulators and Chromebooks.
          generate_release_notes: true
          draft: false
          prerelease: false
