name: Siren Music CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android Licenses & Ensure SDK Components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
              ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            else
              sdkmanager "platforms;android-37" || true
              if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
                HIGHEST_PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* 2>/dev/null | sort -V | tail -n 1)
                if [ -n "$HIGHEST_PLATFORM" ]; then
                  ln -s "$HIGHEST_PLATFORM" "$ANDROID_HOME/platforms/android-37"
                fi
              fi
            fi
          fi

      - name: Setup local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=https://siren-music.onrender.com" >> local.properties

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDevDebugUnitTest --stacktrace

  build-and-release:
    name: Build Signed Release & Publish
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android Licenses & Ensure SDK Components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
              ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            else
              sdkmanager "platforms;android-37" || true
              if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
                HIGHEST_PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* 2>/dev/null | sort -V | tail -n 1)
                if [ -n "$HIGHEST_PLATFORM" ]; then
                  ln -s "$HIGHEST_PLATFORM" "$ANDROID_HOME/platforms/android-37"
                fi
              fi
            fi
          fi

      - name: Setup Secrets (Keystore & local.properties)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${LASTFM_API_KEY}" > local.properties
          echo "LASTFM_SECRET=${LASTFM_SECRET}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=https://siren-music.onrender.com" >> local.properties

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > siren-music-release.jks
            echo "storeFile=siren-music-release.jks" > keystore.properties
            echo "storePassword=${KEYSTORE_PASSWORD:-SirenMusicRelease2026!}" >> keystore.properties
            echo "keyAlias=${KEY_ALIAS:-sirenmusic}" >> keystore.properties
            echo "keyPassword=${KEY_PASSWORD:-SirenMusicRelease2026!}" >> keystore.properties
          fi

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Build Signed Release APKs & Bundle
        run: ./gradlew assembleProdRelease bundleProdRelease --stacktrace

      - name: Compute SHA-256 Checksums
        run: |
          cd app/build/outputs/apk/prod/release
          sha256sum *.apk > checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siren-music-release-artifacts
          path: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/apk/prod/release/checksums.txt
            app/build/outputs/bundle/prodRelease/*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/apk/prod/release/checksums.txt
            app/build/outputs/bundle/prodRelease/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
