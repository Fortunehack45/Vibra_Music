name: VibraMusic
options:
  bundleIdPrefix: com.fortune
  deploymentTarget:
    iOS: "16.0"
targets:
  VibraMusic:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fortune.vibramusic
        PRODUCT_NAME: VibraMusic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "SharedUi"
          - "-lsqlite3"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../sharedUi/build/bin/iosArm64/releaseFramework"
          - "$(SRCROOT)/../sharedUi/build/bin/iosSimulatorArm64/debugFramework"
