AutoName: Vibra Music
Summary: Ad-free music and podcast player with synced lyrics and zero tracking
Description: |-
  Vibra Music is an ad-free, privacy-focused audio player designed for seamless
  streaming and local playback. Engineered with a liquid glass aesthetic and
  powered by Jetpack Compose, Vibra Music provides an immersive listening
  experience without accounts, subscriptions, or telemetry.

  Key Features:
  * Zero tracking: No database, no user accounts, no telemetry collected.
  * Hi-Res lossless streaming and local playback.
  * Synchronized lyrics with word highlighting, translation, and romanization.
  * High-fidelity audio DSP: 10-band equalizer, bass boost, and loudness enhancer.
  * Offline caching and downloads with embedded metadata.
  * Podcasts discovery and episode streaming.
  * Listen Together multi-device synchronized parties.
  * Android Auto and background MediaSession playback.

